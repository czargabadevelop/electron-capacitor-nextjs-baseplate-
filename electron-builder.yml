appId: com.example.mobilesoftware
productName: Mobile Software
copyright: "Copyright © 2025"
directories:
  output: dist
  buildResources: assets
files:
  - "out/**/*"
  - "electron/**/*"
  - "package.json"
asar: true
extraMetadata:
  main: electron/main.mjs
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
        - ia32
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64